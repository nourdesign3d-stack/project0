version: 2

updates:
  # --- GitHub Actions -------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Attendre 7 jours avant de proposer une version fraîchement publiée :
    # une version compromise est généralement détectée dans ce délai.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # --- JavaScript / pnpm ----------------------------------------------------
  # Les mises à jour mineures et correctives sont regroupées pour limiter le bruit.
  # Les majeures arrivent séparément : elles doivent être examinées une par une
  # (le template a déjà subi des ruptures d'API — voir docs/DECISIONS.md).
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/apps/*"
      - "/packages/*"
    schedule:
      interval: "monthly"
    # Attendre 7 jours avant de proposer une version fraîchement publiée :
    # une version compromise est généralement détectée dans ce délai.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Versions épinglées volontairement par le template : à changer explicitement.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # --- Images Docker (compose.yaml) ----------------------------------------
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    # Attendre 7 jours avant de proposer une version fraîchement publiée :
    # une version compromise est généralement détectée dans ce délai.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
# Règles :
#  - aucune fusion automatique ;
#  - une PR Dependabot passe exactement les mêmes contrôles que les autres (CI) ;
#  - une mise à jour majeure est lue, testée et documentée avant fusion.
