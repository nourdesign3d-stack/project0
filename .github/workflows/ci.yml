name: CI

on:
  push:
    branches: [main]
  pull_request:

# Permissions minimales : les jobs de validation ne font que lire le dépôt.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valeurs factices, non secrètes, uniquement destinées à satisfaire la validation
  # des variables d'environnement pendant le build. Aucune connexion réelle n'est établie.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_PUBLIC_WEB_URL: http://localhost:3001
  VERCEL_PROJECT_PRODUCTION_URL: localhost:3000

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install (lockfile figé)
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @repo/database run build

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test

      # Contrôles qui gardent les gardes : sans eux, une régression dans le
      # garde-fou Bash ou dans les frontières passerait inaperçue.
      - name: Tests du garde-fou Bash
        run: pnpm test:hooks

      - name: Tests des scripts d'amorçage
        run: pnpm test:scripts

      - name: Tests du lanceur vibe0
        run: pnpm test:launcher

      - name: Frontières entre workspaces
        run: pnpm boundaries

      # Build **complet** depuis le retrait de BaseHub (D-031) : plus aucune
      # application ne dépend d'un jeton de service pour se construire.
      - name: Build (toutes les applications)
        run: pnpm build

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      # Image épinglée. Attention : cela fige le moteur, PAS les règles — les
      # packs p/… sont téléchargés du registre Semgrep à chaque exécution, donc
      # deux runs identiques peuvent différer. Écart assumé (voir RISKS.md).
      image: semgrep/semgrep:1.171.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Semgrep scan
        run: semgrep ci
        env:
          SEMGREP_RULES: >-
            p/typescript
            p/react
            p/secrets
            p/owasp-top-ten
            .semgrep/rules

  e2e:
    name: Playwright (parcours critiques)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Nécessite une application démarrable (clés de service). À activer via la variable
    # de dépôt ENABLE_E2E=true. Voir docs/DEPLOYMENT.md.
    if: vars.ENABLE_E2E == 'true'
    # Le job démarre lui-même l'application (E2E_START_SERVER), qui exige une base
    # joignable : `DATABASE_URL` du workflow pointe sur ce service.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @repo/database run build
      # Sans schéma appliqué, la page d'accueil authentifiée renvoie 500 : la
      # table qu'elle interroge n'existe pas. `migrate:deploy` n'applique que
      # des migrations versionnées — jamais `db push`.
      - run: pnpm migrate:deploy
      - run: pnpm e2e:install
      - name: Playwright
        run: pnpm e2e
        env:
          # Aucune URL de préversion n'est fournie : Playwright démarre l'app.
          E2E_START_SERVER: "true"
          # Ces quatre-là ne sont pas des secrets, mais leur absence change le
          # comportement : sans elles, Clerk renvoie vers son portail hébergé
          # (`*.accounts.dev`) au lieu des pages `/sign-in` et `/sign-up` de
          # l'application. La CI testait donc une application autrement
          # configurée que le poste de développement, où `.env.local` les
          # fournit. Valeurs alignées sur `apps/app/.env.example`.
          NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
          NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
          NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL: /
          NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL: /
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          # Sans ces secrets, le parcours authentifié reste sauté — le job
          # serait vert sans jamais avoir testé une connexion.
          E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          # Clerk vérifie chaque nouvel appareil : en CI, la machine est toujours
          # neuve, donc ce code est exigé à chaque exécution.
          E2E_USER_OTP: ${{ secrets.E2E_USER_OTP }}

      # Les rapports peuvent contenir des captures d'écran : ne jamais y laisser de secret.
      - name: Rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
