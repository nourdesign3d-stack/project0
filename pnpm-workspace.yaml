packages: # nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
  - 'apps/*'
  - 'packages/*'

# Versions imposées à tout l'arbre, dépendances transitives comprises.
# pnpm 10 lit ce réglage ici, pas dans le champ `overrides` de package.json.
# ⚠️ Un `overrides` placé dans package.json est **silencieusement ignoré**. Le
# dépôt en portait un sur `parse5` : deux versions coexistaient malgré lui, ce
# qu'un override effectif interdit. Retiré le 2026-08-06 plutôt que déplacé —
# `parse5` ne figure dans aucune alerte, et forcer une version sans besoin mesuré
# est une contrainte gratuite. Relevé en audit (D-038).
overrides:
  # `@react-email/ui` dépend de next 16.2.6, sous le seuil de correction 16.2.11 :
  # il réintroduisait 9 alertes de vulnérabilité, dont 4 de sévérité haute, alors
  # que toutes les applications déclarent 16.2.12. Relevé par audit externe.
  next: 16.2.12

  # `next` embarque sa propre copie de `sharp` en 0.34.x, sous le seuil de
  # correction 0.35.0 : monter la dépendance directe de `apps/web` ne suffisait
  # pas, l'arbre gardait une version vulnérable atteignable par l'optimisation
  # d'images. Quatre CVE héritées de libvips (CVE-2026-33327, -33328, -35590,
  # -35591), gravité haute — **la seule alerte du dépôt réellement atteignable
  # en production**, sur les 58 que compte l'arbre. Voir D-056.
  sharp: ^0.35.3

# --- Durcissement de la chaîne d'approvisionnement (pnpm >= 10.26) ---
# Motivé par les règles Semgrep p/owasp-top-ten sur les gestionnaires de paquets.

# `minimumReleaseAge` est volontairement absent.
# Essayé à 10080 (7 jours) : `pnpm install` échoue dès qu'une dépendance transitive
# n'a qu'une version récente (constaté avec @rollup/rollup-freebsd-arm64 via
# @sentry/nextjs), ce qui rend l'installation non reproductible.
# Le délai de latence est appliqué là où les nouvelles versions entrent réellement :
# `cooldown: default-days: 7` dans .github/dependabot.yml, le lockfile faisant foi.
# nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age

# Empêche une mise à jour de dépendance d'abaisser les réglages de sécurité.
# Ce contrôle a déjà écarté quatre paquets en une semaine : @langchain/core,
# @arcjet/next, resend et chokidar. Il est utile — mais il refuse aussi des
# montées de version légitimes, y compris des correctifs de sécurité.
trustPolicy: no-downgrade

# Exceptions nommées et datées. Chacune doit porter sa raison, comme un
# `nosemgrep` : une exception muette est un contournement.
trustPolicyExclude:
  # 2026-08-05 — chokidar bloquait la montée de react-email 5 → 6, seule voie
  # pour retirer `next@16.1.6` de l'arbre et fermer 28 alertes réelles.
  # Le signal est une **perte d'attestation de provenance** entre deux versions,
  # pas une preuve de compromission : l'éditeur publie de façon irrégulière.
  # Un contrôle qui empêche d'appliquer un correctif de sécurité protège moins
  # qu'il ne coûte.
  #
  # ÉCHÉANCE : à réexaminer avant le 2026-11-05 (trois mois). Vérifier si chokidar
  # a retrouvé une attestation de provenance ; si oui, retirer cette ligne. Le
  # contrôle est rappelé par la commande /vibe.
  - chokidar

  # 2026-08-07 — `semver@6.3.1` bloquait **toute** montée de version du dépôt.
  #
  # Découvert en voulant appliquer un correctif de sécurité (sharp, 4 CVE
  # libvips) : `pnpm install --frozen-lockfile` passe, mais `pnpm add` et
  # `pnpm up` échouent — sur un paquet **déjà présent dans le lockfile**, atteint
  # par `@vitejs/plugin-react > @babel/core > @babel/helper-compilation-targets`.
  #
  # Cette exception n'admet donc **aucun paquet nouveau** : elle reconnaît un
  # paquet déjà installé, dont rien sur le disque ne change. Ce qu'elle débloque,
  # c'est la capacité à corriger.
  #
  # Le signal est une perte d'attestation de provenance, pas une preuve de
  # compromission — `semver` 6.3.1 est publié par l'équipe npm elle-même et
  # antérieur à la généralisation des attestations. Un contrôle qui gèle
  # l'application des correctifs de sécurité protège moins qu'il ne coûte : le
  # dépôt était devenu incapable de traiter la seule alerte atteignable en
  # production. Voir R-015 et D-056.
  #
  # ÉCHÉANCE : à réexaminer avant le 2026-11-07 (trois mois). Vérifier si la
  # chaîne Babel a cessé de dépendre de `semver` 6.x — auquel cas retirer cette
  # ligne. Rappelé par la commande /vibe.
  - semver

# Interdit l'installation de dépendances transitives depuis des sources exotiques
# (git, tarball distant) plutôt que depuis le registre.
blockExoticSubdeps: true
# Les scripts d'installation (postinstall) restent bloqués par défaut (pnpm 10).
# Le dépôt se construit sans eux — vérifié : `prisma generate`, `next build`.
# N'ajouter `onlyBuiltDependencies` que si un besoin réel apparaît, paquet par paquet.
